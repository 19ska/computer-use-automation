[project]
name = "computer-use-automation"
version = "0.1.0"
description = "Computer-use automation system for legacy back-office apps (take-home project)"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "google-genai>=0.5",
    "groq>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
